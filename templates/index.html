{% extends "base.html" %}
{% block content %}
<h1>Microblog</h1>
<!-- TODO: new-post form (logged-in users only) -->
<!-- TODO: list posts here, newest first -->
{% if posts %}
  <ul>
    {% for post in posts %}
      <li>{{ post.author }}: {{ post.body }}</li>
    {% endfor %}
  </ul>
{% else %}
  <p>No posts yet.</p>
{% endif %}
{% endblock %}
